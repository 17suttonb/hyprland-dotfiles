# AUTOSTART APPLICATIONS
exec-once = waybar &
exec-once = hypridle &
exec-once = systemctl --user start hyprpolkitagent &
exec-once = udiskie &
exec-once = swaync &
exec-once = gnome-keyring-daemon --start --components=secrets &
exec-once = vicinae server &
exec-once = systemctl --user start hyprpaper && waytrogen -r -s 1 && ~/.config/scripts/theme/theme-sync.sh
exec-once = hyprswitch init --show-title --size-factor 5 --workspaces-per-row 4 --custom-css $configDir/hyprswitch.css &
exec-once = hyprpm reload -n &